[project]
name = "lumen-media-search"
version = "0.1.0"
description = "Private, local semantic search for photos and videos"
readme = "README.md"
authors = [
    { name = "Igor Doktor" },
]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
keywords = [
    "clip",
    "local-first",
    "mojo",
    "openvino",
    "photo-search",
    "semantic-search",
    "video-search",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
]
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.116,<1",
    "huggingface-hub>=1.5,<2",
    "numpy>=2.1,<3",
    "opencv-python-headless>=4.12,<5",
    "openvino>=2026.0,<2027",
    "pillow>=11.3,<14",
    "platformdirs>=4.3,<5",
    "transformers>=5.14.1,<6",
    "uvicorn>=0.35,<1",
]

[project.urls]
Homepage = "https://github.com/doktorigi/lumen-media-search"
Issues = "https://github.com/doktorigi/lumen-media-search/issues"
Repository = "https://github.com/doktorigi/lumen-media-search"

[project.scripts]
lumen = "lumen_media.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.9,<3",
    "pytest>=8.4,<10",
    "pytest-cov>=6.2,<8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lumen_media"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.gitignore",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
