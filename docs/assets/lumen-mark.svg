<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Lumen</title>
  <desc id="desc">A warm point of light surrounded by two orbital rings.</desc>
  <defs>
    <radialGradient id="background" cx="38%" cy="30%" r="80%">
      <stop offset="0" stop-color="#252a2a" />
      <stop offset="1" stop-color="#0b0d0e" />
    </radialGradient>
    <radialGradient id="light">
      <stop offset="0" stop-color="#fff3cf" />
      <stop offset="0.42" stop-color="#f6bd69" />
      <stop offset="1" stop-color="#d87836" />
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" />
    </filter>
  </defs>
  <rect width="96" height="96" rx="24" fill="url(#background)" />
  <ellipse cx="48" cy="48" rx="31" ry="17" fill="none" stroke="#f6bd69" stroke-opacity=".25" stroke-width="1.5" transform="rotate(-24 48 48)" />
  <ellipse cx="48" cy="48" rx="24" ry="37" fill="none" stroke="#fff3cf" stroke-opacity=".13" stroke-width="1.25" transform="rotate(38 48 48)" />
  <circle cx="48" cy="48" r="13" fill="#e5954f" opacity=".32" filter="url(#glow)" />
  <circle cx="48" cy="48" r="7.5" fill="url(#light)" />
  <circle cx="48" cy="48" r="2.5" fill="#fff9e8" />
</svg>
